server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same job the Vite dev proxy does, so the frontend code is identical in
    # both environments: /api is always same-origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An LLM call is slower than nginx's 60s default.
        proxy_read_timeout 120s;

        # /api/generate is server-sent events. Buffering here would hold each
        # frame until the turn finished, so the UI would jump straight to the
        # final layout. The backend also sends X-Accel-Buffering: no, which
        # nginx honours on its own -- this is the belt to that brace, kept
        # because losing either one fails silently: the stream still works,
        # it just stops being progressive.
        proxy_buffering off;
        proxy_cache off;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # clients pin themselves to an old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
